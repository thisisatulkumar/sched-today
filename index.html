<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Today</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="dayCarousel">
        <div class="prevDay">&lt;</div>
        <div class="currDay"></div>
        <div class="nextDay">&gt;</div>
      </div>

      <select class="branchSelect">
        <option value="CSE-R">CSE-R</option>
        <option value="CSE-AI">CSE-AI</option>
        <option value="CSE-SF">CSE-SF</option>
        <option value="ECE">ECE</option>
        <option value="EE">EE</option>
        <option value="ME">ME</option>
        <option value="CE">CE</option>
        <option value="CHE">CHE</option>
      </select>

      <h1 class="underline">Mess</h1>
      <div class="messMenu"></div>

      <h1>Classes</h1>
      <div class="timeTable"></div>
    </div>
    <footer>
      <p>
        Built by
        <a href="https://www.linkedin.com/in/thisisatulkumar/">Atul Kumar</a>
      </p>
      <p>
        <a href="https://github.com/thisisatulkumar/sched-today">Source Code</a>
      </p>
    </footer>
    <script src="main.js"></script>
  </body>
</html>
